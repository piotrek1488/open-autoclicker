<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>

  <!-- click ripple rings emanating from the cursor tip -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <circle cx="196" cy="196" r="92" stroke-opacity="0.30" stroke-width="14"/>
    <circle cx="196" cy="196" r="132" stroke-opacity="0.16" stroke-width="12"/>
  </g>

  <!-- mouse cursor arrow -->
  <g transform="translate(196 196) rotate(-8)">
    <path d="M0 0 L0 196 L46 150 L82 232 L120 214 L84 134 L150 134 Z"
          fill="url(#cursor)" stroke="#1e3a8a" stroke-width="12"
          stroke-linejoin="round"/>
  </g>
</svg>
