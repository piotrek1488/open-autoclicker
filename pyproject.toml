[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-autoclicker"
version = "1.0.3"
description = "Cross-platform mouse auto clicker with GUI, global hotkey and configurable click behaviour."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Open Auto Clicker contributors" }]
keywords = ["autoclicker", "mouse", "automation", "clicker", "pyside6"]
dependencies = [
    "PySide6>=6.5",
    "pynput>=1.7.6",
    # Linux-only: used for cursor control under Wayland via /dev/uinput.
    "evdev>=1.6; sys_platform == 'linux'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/example/open-autoclicker"
Repository = "https://github.com/example/open-autoclicker"

[project.scripts]
open-autoclicker = "open_autoclicker.app:main"

[project.gui-scripts]
open-autoclicker-gui = "open_autoclicker.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_autoclicker = ["resources/*.svg", "resources/*.png"]
