name: Build

# Build installable packages for all three platforms.
# Runs on every push to master (e.g. after a PR merge) and on pull requests
# so breakage is caught before merging. Artifacts are uploaded for download
# from the Actions run page.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-deb
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos-dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      # ---- Linux: PyInstaller bundle -> .deb ---------------------------------
      - name: Build Linux .deb
        if: runner.os == 'Linux'
        run: |
          pyinstaller packaging/open-autoclicker.spec
          bash packaging/build-deb.sh

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.deb
          if-no-files-found: error

      # ---- Windows: PyInstaller folder -> zip --------------------------------
      - name: Build Windows bundle
        if: runner.os == 'Windows'
        run: pyinstaller packaging/open-autoclicker.spec

      - name: Zip Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/open-autoclicker/* -DestinationPath dist/open-autoclicker-windows.zip

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/open-autoclicker-windows.zip
          if-no-files-found: error

      # ---- macOS: PyInstaller .app -> .dmg -----------------------------------
      - name: Build macOS .dmg
        if: runner.os == 'macOS'
        run: |
          pyinstaller packaging/open-autoclicker.spec
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          hdiutil create -volname "Open Auto Clicker" \
            -srcfolder "dist/Open Auto Clicker.app" \
            -ov -format UDZO "dist/OpenAutoClicker-${VERSION}.dmg"

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.dmg
          if-no-files-found: error
