name: Release

# Build packages for all three platforms and publish them as a GitHub Release.
# Triggered by pushing a version tag, e.g. `git tag v1.0.0 && git push --tags`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create the release and upload assets

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build Linux .deb
        if: runner.os == 'Linux'
        run: |
          pyinstaller packaging/open-autoclicker.spec
          bash packaging/build-deb.sh

      - name: Build Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller packaging/open-autoclicker.spec
          Compress-Archive -Path dist/open-autoclicker/* -DestinationPath dist/open-autoclicker-windows.zip

      - name: Build macOS .dmg
        if: runner.os == 'macOS'
        run: |
          pyinstaller packaging/open-autoclicker.spec
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          hdiutil create -volname "Open Auto Clicker" \
            -srcfolder "dist/Open Auto Clicker.app" \
            -ov -format UDZO "dist/OpenAutoClicker-${VERSION}.dmg"

      - name: Collect artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.deb
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
